<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BMI Calculation</title>
    <link rel="icon" type="image/x-icon" href="bmi.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-bg { background: radial-gradient(circle at top right, #1e293b, #020617); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        ::placeholder { color: #64748b; opacity: 0.8; }
    </style>
</head>

<body class="gradient-bg text-slate-200 min-h-screen flex items-center justify-center p-6">

    <div class="glass p-8 rounded-3xl w-full max-w-md shadow-2xl relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600/20 rounded-full blur-3xl"></div>

        <header class="mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                BMI Calculator
            </h1>
            <p class="text-slate-400 text-sm mt-1">For adults aged 18 years and above.</p>
        </header>

        <div class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Height</label>
                <div class="flex gap-4">
                    <div class="relative flex-1">
                        <input type="number" id="ft" placeholder="5" value="5" 
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition">
                        <span class="absolute right-4 top-3 text-slate-500 text-sm italic">ft</span>
                    </div>
                    <div class="relative flex-1">
                        <input type="number" id="inch" placeholder="4" value="4" 
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition">
                        <span class="absolute right-4 top-3 text-slate-500 text-sm italic">in</span>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Weight</label>
                <div class="relative">
                    <input type="number" id="kg" placeholder="63.2" value="63.2" step='0.1'
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 transition">
                    <span class="absolute right-4 top-3 text-slate-500 text-sm italic">kg</span>
                </div>
            </div>

            <button onclick="calculateBMI()" 
                class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/20 transition-all transform active:scale-95">
                Calculate BMI
            </button>

            <div id="result_area" class="hidden space-y-4 pt-6 border-t border-white/5">
                <div id="bmi" class="text-lg font-bold"></div>
                <div id="healthy_bmi" class="text-sm text-slate-400 leading-relaxed"></div>
                <div id="avg_healthy_bmi" class="p-4 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl text-emerald-400 text-sm font-medium"></div>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="../" class="text-xs text-slate-500 hover:text-blue-400 transition uppercase tracking-widest">← Back to Projects</a>
        </div>
    </div>

    <script>
    function calculateBMI() {
        var ft = parseFloat(document.getElementById("ft").value) || 0;
        var inch = parseFloat(document.getElementById("inch").value) || 0;
        var kg = parseFloat(document.getElementById("kg").value) || 0;
        
        var totalInches = (ft * 12) + inch;
        var heightInMeters = totalInches * 0.0254;
        
        if (heightInMeters > 0 && kg > 0) {
            var bmi = (kg / (heightInMeters * heightInMeters)).toFixed(2);
            var lowWeight = (18.5 * (heightInMeters * heightInMeters)).toFixed(2);
            var highWeight = (24.9 * (heightInMeters * heightInMeters)).toFixed(2);
            var avgWeight = ((parseFloat(lowWeight) + parseFloat(highWeight)) / 2).toFixed(2);

            document.getElementById("result_area").classList.remove("hidden");
            document.getElementById("bmi").innerHTML = `Your BMI: <span class="text-blue-400">${bmi} kg/m²</span>`;
            document.getElementById("healthy_bmi").innerHTML = `Healthy weight for your height: <span class="text-slate-200">${lowWeight} kg - ${highWeight} kg</span>`;
            document.getElementById("avg_healthy_bmi").innerHTML = `Target average weight: ${avgWeight} kg`;
        } else {
            alert("Please enter valid height and weight values.");
        }
    }
    </script>
</body>
</html>
