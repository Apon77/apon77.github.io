<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Price Calculator</title>
    <style>
        body{font-family:sans-serif;max-width:540px;margin:20px auto;padding:15px;background:#f8f9fa;color:#212529}
        .item-name-box{margin-bottom:12px}
        .item-name-box input, .search-box input{width:100%;box-sizing:border-box;padding:9px 12px;text-align:left;font-size:15px;border:1px solid #ccc;border-radius:6px}
        .row{display:flex;align-items:center;justify-content:space-between;background:white;padding:10px 12px;margin-bottom:8px;border:1px solid #ddd;border-radius:6px;gap:6px}
        .row label{font-weight:bold;min-width:72px;font-size:14px}
        input[type="number"], input[type="text"].unit-input{width:75px;padding:6px;border:1px solid #ccc;border-radius:4px;text-align:center}
        .unit-input{width:48px !important;font-weight:bold}
        .unit-container{display:flex;align-items:center;gap:4px;font-weight:bold;color:#495057}
        .unit-label{min-width:48px;display:inline-block;text-align:center}
        .btn-remove{background:transparent;color:#dc3545;border:none;font-size:16px;font-weight:bold;cursor:pointer;padding:2px 6px;flex:none}
        .btn-remove:hover{color:#a71d2a}
        .btn-remove.invisible{visibility:hidden;pointer-events:none}
        .btn-group{display:flex;gap:10px;margin-top:15px}
        button{flex:1;padding:12px;font-size:15px;font-weight:bold;border:none;border-radius:6px;cursor:pointer}
        .btn-calc{background:#007bff;color:white}
        .btn-calc:hover{background:#0056b3}
        .btn-add{background:#28a745;color:white;max-width:140px}
        .btn-add:hover{background:#218838}
        .btn-reset{background:#6c757d;color:white;max-width:95px}
        .btn-reset:hover{background:#5a6268}
        #result-box{margin-top:15px;padding:15px;background:#e9ecef;border-radius:6px;display:none;line-height:1.5}
        .res-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
        .res-table th,.res-table td{padding:8px;text-align:left;border-bottom:1px solid #ddd}
        .res-table th{background:#e2e6ea;font-weight:bold}
        .win-row{background:#d4edda;font-weight:bold;color:#155724}
        .save-txt{color:#28a745;font-weight:500}
        .dup-notice{font-size:12px;color:#6c757d;margin-top:8px;font-style:italic}

        /* History Styles */
        .history-section{margin-top:30px;border-top:2px solid #dee2e6;padding-top:15px}
        .history-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
        .history-header h3{margin:0}
        .history-tools{display:flex;gap:6px}
        .btn-tool{padding:6px 10px;font-size:12px;flex:none;border-radius:4px;color:white}
        .btn-export{background:#17a2b8}
        .btn-export:hover{background:#138496}
        .btn-import{background:#6f42c1}
        .btn-import:hover{background:#59339d}
        .btn-clear{background:#dc3545}
        .btn-clear:hover{background:#c82333}
        .search-box{margin-bottom:12px}
        .history-card{background:white;border:1px solid #ddd;border-radius:6px;padding:12px;margin-bottom:10px;font-size:14px}
        .history-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;border-bottom:1px solid #eee;padding-bottom:6px;gap:8px}
        .history-title{font-weight:bold;font-size:15px;color:#007bff}
        .history-date{font-size:12px;color:#6c757d;white-space:nowrap}
        .history-opts{color:#495057;margin-bottom:8px;line-height:1.5}
        .history-actions{display:flex;gap:8px;justify-content:flex-end}
        .btn-sm{padding:5px 10px;font-size:12px;flex:none;border-radius:4px;color:white}
        .btn-restore{background:#17a2b8}
        .btn-restore:hover{background:#138496}
        .btn-del{background:#6c757d}
        .btn-del:hover{background:#5a6268}
        .empty-msg{color:#6c757d;font-style:italic;text-align:center;padding:15px}
    </style>
</head>
<body>
    <h2>Compare Options</h2>

    <div class="item-name-box">
        <input type="text" id="item-name" placeholder="Item Name (optional, e.g. Cooking Oil)">
    </div>

    <div id="options-container"></div>

    <div class="btn-group">
        <button class="btn-add" onclick="addOptionRow()">➕ Add Option</button>
        <button class="btn-reset" onclick="resetForm()">Reset</button>
        <button class="btn-calc" onclick="compareAll()">Find Most Profitable</button>
    </div>

    <div id="result-box"></div>

    <!-- History Section -->
    <div class="history-section">
        <div class="history-header">
            <h3>🕒 History (<span id="history-count">0</span>)</h3>
            <div class="history-tools">
                <button class="btn-tool btn-export" onclick="exportHistory()">⬇ Export</button>
                <button class="btn-tool btn-import" onclick="document.getElementById('import-file').click()">⬆ Import</button>
                <button class="btn-tool btn-clear" onclick="clearHistory()">Clear</button>
                <input type="file" id="import-file" accept=".json" style="display:none" onchange="importHistory(event)">
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 Search history by item name, unit, quantity, or price..." oninput="renderHistory()">
        </div>

        <div id="history-list"></div>
    </div>

    <script>
        const STORAGE_KEY = 'price_calc_history_v2';
        let currentUnit = 'g';

        window.onload = () => {
            initDefaultRows();
            renderHistory();
        };

        function initDefaultRows() {
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            addOptionRow(40, 15);
            addOptionRow(248, 110);
        }

        function resetForm() {
            document.getElementById('item-name').value = '';
            currentUnit = 'g';
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            addOptionRow('', '');
            addOptionRow('', '');
            document.getElementById('result-box').style.display = 'none';
        }

        function addOptionRow(qty = '', price = '') {
            const container = document.getElementById('options-container');
            const index = container.children.length + 1;
            const row = document.createElement('div');
            row.className = 'row';

            const unitControl = index === 1
                ? `<input type="text" id="main-unit" class="unit-input" value="${escapeAttr(currentUnit)}" oninput="updateUnits()" placeholder="unit"> =`
                : `<span class="unit-label">${escapeHTML(currentUnit)}</span> =`;

            row.innerHTML = `
                <label class="opt-label">Option ${index}:</label>
                <input type="number" class="qty-input" placeholder="Quantity" value="${qty}" step="any">
                <div class="unit-container">${unitControl}</div>
                <input type="number" class="price-input" placeholder="Price" value="${price}" step="any"> Tk
                <button type="button" class="btn-remove" title="Remove row" onclick="removeOptionRow(this)">✕</button>
            `;
            container.appendChild(row);
            reindexRows();
        }

        function removeOptionRow(btn) {
            const container = document.getElementById('options-container');
            if (container.children.length <= 2) return;
            btn.closest('.row').remove();
            reindexRows();
        }

        function reindexRows() {
            const rows = document.querySelectorAll('#options-container .row');
            const canRemove = rows.length > 2;
            rows.forEach((row, idx) => {
                const num = idx + 1;
                row.querySelector('.opt-label').innerText = `Option ${num}:`;

                // Ensure first row always holds the editable unit input
                const unitContainer = row.querySelector('.unit-container');
                if (num === 1 && !unitContainer.querySelector('#main-unit')) {
                    unitContainer.innerHTML = `<input type="text" id="main-unit" class="unit-input" value="${escapeAttr(currentUnit)}" oninput="updateUnits()" placeholder="unit"> =`;
                } else if (num > 1 && unitContainer.querySelector('#main-unit')) {
                    unitContainer.innerHTML = `<span class="unit-label">${escapeHTML(currentUnit)}</span> =`;
                }

                const rmBtn = row.querySelector('.btn-remove');
                rmBtn.classList.toggle('invisible', !canRemove);
            });
        }

        function updateUnits() {
            const mainInput = document.getElementById('main-unit');
            currentUnit = (mainInput ? mainInput.value : '') || 'unit';
            document.querySelectorAll('#options-container .unit-label').forEach(el => {
                el.innerText = currentUnit;
            });
        }

        // Generates a deterministic signature to prevent duplicate saves
        function createSignature(itemName, unit, options) {
            const normalizedOpts = options
                .map(o => `${o.w}:${o.p}`)
                .sort()
                .join('|');
            return `${itemName.toLowerCase()}::${unit.toLowerCase()}::${normalizedOpts}`;
        }

        function compareAll(skipSave = false) {
            const rows = document.querySelectorAll('#options-container .row');
            const u = currentUnit || 'unit';
            const itemName = document.getElementById('item-name').value.trim() || 'Unnamed Comparison';
            let opts = [], maxQ = 0;

            rows.forEach((row, idx) => {
                const w = parseFloat(row.querySelector('.qty-input').value);
                const p = parseFloat(row.querySelector('.price-input').value);
                if (!isNaN(p) && !isNaN(w) && w > 0) {
                    opts.push({ i: idx + 1, cost: p / w, w, p });
                    if (w > maxQ) maxQ = w;
                }
            });

            const box = document.getElementById('result-box');
            if (opts.length < 2) {
                box.style.display = 'block';
                box.innerHTML = "❌ Please enter at least 2 valid options to compare.";
                return;
            }

            const sortedOpts = [...opts].sort((a, b) => a.cost - b.cost);
            const win = sortedOpts[0];

            let statusNote = '';
            if (!skipSave) {
                const saved = saveToHistory({
                    id: Date.now(),
                    signature: createSignature(itemName, u, opts),
                    timestamp: new Date().toISOString(),
                    date: new Date().toLocaleString([], { dateStyle: 'medium', timeStyle: 'medium' }),
                    itemName,
                    unit: u,
                    options: opts,
                    winnerOption: win.i
                });
                if (!saved) {
                    statusNote = `<div class="dup-notice">ℹ️ Already in history (duplicate skipped).</div>`;
                }
            }

            let html = `<strong>📊 Breakdown at ${maxQ} ${escapeHTML(u)} Benchmark:</strong>
                <table class="res-table">
                    <tr><th>Option</th><th>Tk/${escapeHTML(u)}</th><th>Total Cost</th><th>Money Saved</th></tr>`;

            sortedOpts.forEach(o => {
                const isW = o.i === win.i;
                const cMax = o.cost * maxQ;
                const wMax = win.cost * maxQ;
                html += `<tr class="${isW ? 'win-row' : ''}">
                    <td>Option ${o.i} ${isW ? '🏆' : ''}</td>
                    <td>${o.cost.toFixed(4)}</td>
                    <td>${cMax.toFixed(2)} Tk</td>
                    <td>${isW ? 'Best Value' : `<span class="save-txt">Saved ${(cMax - wMax).toFixed(2)} Tk</span>`}</td>
                </tr>`;
            });

            box.style.display = 'block';
            box.innerHTML = html + '</table>' + statusNote;
        }

        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch {
                return [];
            }
        }

        function saveToHistory(entry) {
            const history = getHistory();
            // Check if an identical comparison already exists
            const isDuplicate = history.some(h => {
                const existingSig = h.signature || createSignature(h.itemName, h.unit, h.options);
                return existingSig === entry.signature;
            });

            if (isDuplicate) return false;

            history.unshift(entry);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            renderHistory();
            return true;
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const history = getHistory();
            document.getElementById('history-count').innerText = history.length;

            const filtered = query
                ? history.filter(item => {
                    const optsText = item.options.map(o => `${o.w} ${item.unit} ${o.p} tk`).join(' ');
                    const searchable = `${item.itemName} ${item.unit} ${item.date} ${optsText}`.toLowerCase();
                    return searchable.includes(query);
                })
                : history;

            if (history.length === 0) {
                list.innerHTML = '<div class="empty-msg">No saved comparisons yet.</div>';
                return;
            }

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-msg">No matching history found.</div>';
                return;
            }

            list.innerHTML = filtered.map(item => {
                const optsSummary = item.options.map(o =>
                    `<span style="${o.i === item.winnerOption ? 'color:#155724;font-weight:bold;' : ''}">
                        Opt ${o.i}: ${o.w}${escapeHTML(item.unit)} = ${o.p} Tk ${o.i === item.winnerOption ? '🏆' : ''}
                    </span>`
                ).join(' &nbsp;|&nbsp; ');

                return `
                <div class="history-card">
                    <div class="history-top">
                        <span class="history-title">${escapeHTML(item.itemName)}</span>
                        <span class="history-date">${escapeHTML(item.date)}</span>
                    </div>
                    <div class="history-opts">${optsSummary}</div>
                    <div class="history-actions">
                        <button class="btn-sm btn-restore" onclick="restoreHistory(${item.id})">Restore</button>
                        <button class="btn-sm btn-del" onclick="deleteHistory(${item.id})">Delete</button>
                    </div>
                </div>`;
            }).join('');
        }

        function restoreHistory(id) {
            const item = getHistory().find(h => h.id === id);
            if (!item) return;

            document.getElementById('item-name').value = item.itemName === 'Unnamed Comparison' ? '' : item.itemName;
            currentUnit = item.unit || 'g';

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            item.options.forEach(opt => addOptionRow(opt.w, opt.p));
            while (container.children.length < 2) addOptionRow('', '');

            compareAll(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteHistory(id) {
            const history = getHistory().filter(h => h.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            renderHistory();
        }

        function clearHistory() {
            if (getHistory().length === 0) return;
            if (confirm('Clear all saved comparison history?')) {
                localStorage.removeItem(STORAGE_KEY);
                renderHistory();
            }
        }

        function exportHistory() {
            const history = getHistory();
            if (history.length === 0) {
                alert('No history to export.');
                return;
            }
            const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `price-comparisons-${dateStamp}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importHistory(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported)) throw new Error('Invalid format');

                    const current = getHistory();
                    const existingSigs = new Set(
                        current.map(h => h.signature || createSignature(h.itemName, h.unit, h.options))
                    );

                    let addedCount = 0;
                    imported.forEach((item, idx) => {
                        if (!item || !Array.isArray(item.options) || item.options.length < 2) return;
                        const sig = item.signature || createSignature(item.itemName || 'Unnamed Comparison', item.unit || 'unit', item.options);
                        if (!existingSigs.has(sig)) {
                            existingSigs.add(sig);
                            current.push({
                                id: item.id || (Date.now() + idx),
                                signature: sig,
                                timestamp: item.timestamp || new Date().toISOString(),
                                date: item.date || new Date().toLocaleString([], { dateStyle: 'medium', timeStyle: 'medium' }),
                                itemName: item.itemName || 'Unnamed Comparison',
                                unit: item.unit || 'unit',
                                options: item.options,
                                winnerOption: item.winnerOption || 1
                            });
                            addedCount++;
                        }
                    });

                    // Sort newest first by ID/timestamp
                    current.sort((a, b) => b.id - a.id);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
                    renderHistory();
                    alert(`Imported ${addedCount} new comparison(s). Duplicates were skipped.`);
                } catch {
                    alert('❌ Invalid JSON file. Please select a valid exported history file.');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function escapeAttr(str) {
            return String(str).replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
