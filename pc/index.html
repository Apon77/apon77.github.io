<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Price Calculator</title>
    <style>
        body{font-family:sans-serif;max-width:520px;margin:20px auto;padding:15px;background:#f8f9fa}
        .row{display:flex;align-items:center;justify-content:space-between;background:white;padding:12px;margin-bottom:8px;border:1px solid #ddd;border-radius:6px}
        .row.hidden{display:none}
        .row label{font-weight:bold;width:80px}
        input{width:75px;padding:6px;border:1px solid #ccc;border-radius:4px;text-align:center}
        .unit-input{width:50px;font-weight:bold;text-align:center}
        .unit-container{display:flex;align-items:center;gap:4px;font-weight:bold;color:#495057}
        .unit-label{min-width:50px;display:inline-block;text-align:center}
        .btn-group{display:flex;gap:10px;margin-top:15px}
        button{flex:1;padding:12px;font-size:16px;font-weight:bold;border:none;border-radius:6px;cursor:pointer}
        .btn-calc{background:#007bff;color:white}
        .btn-calc:hover{background:#0056b3}
        .btn-add{background:#28a745;color:white;max-width:130px}
        .btn-add:hover{background:#218838}
        #result-box{margin-top:15px;padding:15px;background:#e9ecef;border-radius:6px;display:none;line-height:1.5}
        .res-table{width:100%;border-collapse:collapse;margin-top:10px}
        .res-table th,.res-table td{padding:8px;text-align:left;border-bottom:1px solid #ddd}
        .res-table th{background:#e2e6ea;font-weight:bold}
        .win-row{background:#d4edda;font-weight:bold;color:#155724}
        .save-txt{color:#28a745;font-weight:500}
    </style>
</head>
<body>
    <h2>Compare Options</h2>
    <div id="options-container">
        <div class="row" id="row1">
            <label>Option 1:</label>
            <input type="number" id="w1" placeholder="Quantity" value="40"> 
            <div class="unit-container">
                <input type="text" id="main-unit" class="unit-input" value="g" oninput="updateUnits()" placeholder="unit"> =
            </div>
            <input type="number" id="p1" placeholder="Price" value="15"> Tk
        </div>
        <div class="row" id="row2">
            <label>Option 2:</label>
            <input type="number" id="w2" placeholder="Quantity" value="248"> 
            <div class="unit-container"><span class="unit-label" id="u2">g</span> =</div>
            <input type="number" id="p2" placeholder="Price" value="110"> Tk
        </div>
        <div class="row hidden" id="row3">
            <label>Option 3:</label>
            <input type="number" id="w3" placeholder="Quantity"> 
            <div class="unit-container"><span class="unit-label" id="u3">g</span> =</div>
            <input type="number" id="p3" placeholder="Price"> Tk
        </div>
        <div class="row hidden" id="row4">
            <label>Option 4:</label>
            <input type="number" id="w4" placeholder="Quantity"> 
            <div class="unit-container"><span class="unit-label" id="u4">g</span> =</div>
            <input type="number" id="p4" placeholder="Price"> Tk
        </div>
        <div class="row hidden" id="row5">
            <label>Option 5:</label>
            <input type="number" id="w5" placeholder="Quantity"> 
            <div class="unit-container"><span class="unit-label" id="u5">g</span> =</div>
            <input type="number" id="p5" placeholder="Price"> Tk
        </div>
        <div class="row hidden" id="row6">
            <label>Option 6:</label>
            <input type="number" id="w6" placeholder="Quantity"> 
            <div class="unit-container"><span class="unit-label" id="u6">g</span> =</div>
            <input type="number" id="p6" placeholder="Price"> Tk
        </div>
    </div>
    <div class="btn-group">
        <button class="btn-add" id="add-btn" onclick="showNextOption()">➕ Add Option</button>
        <button class="btn-calc" onclick="compareAll()">Find Most Profitable</button>
    </div>
    <div id="result-box"></div>
    <script>
        let visibleCount = 2;
        function updateUnits() {
            const u = document.getElementById('main-unit').value || 'unit';
            for (let i = 2; i <= 6; i++) document.getElementById(`u${i}`).innerText = u;
        }
        function showNextOption() {
            if (visibleCount < 6) {
                visibleCount++;
                document.getElementById(`row${visibleCount}`).classList.remove('hidden');
            }
            if (visibleCount === 6) document.getElementById('add-btn').style.display = 'none';
        }
        function compareAll() {
            let opts = [], u = document.getElementById('main-unit').value || 'unit', maxQ = 0;
            for (let i = 1; i <= visibleCount; i++) {
                const p = parseFloat(document.getElementById(`p${i}`).value), w = parseFloat(document.getElementById(`w${i}`).value);
                if (!isNaN(p) && !isNaN(w) && w > 0) {
                    opts.push({ i, cost: p / w, w });
                    if (w > maxQ) maxQ = w;
                }
            }
            const box = document.getElementById('result-box');
            if (opts.length < 2) {
                box.style.display = 'block';
                box.innerHTML = "❌ Please enter at least 2 options to compare.";
                return;
            }
            opts.sort((a, b) => a.cost - b.cost);
            const win = opts[0];
            let html = `<strong>📊 Breakdown at ${maxQ} ${u} Benchmark:</strong><table class="res-table"><tr><th>Option</th><th>Tk/${u}</th><th>Total Cost</th><th>Money Saved</th></tr>`;
            opts.forEach(o => {
                const isW = o.i === win.i, cMax = o.cost * maxQ, wMax = win.cost * maxQ;
                html += `<tr class="${isW ? 'win-row' : ''}">
                    <td>Option ${o.i} ${isW ? '🏆' : ''}</td>
                    <td>${o.cost.toFixed(4)}</td>
                    <td>${cMax.toFixed(2)} Tk</td>
                    <td>${isW ? 'Best Value' : `<span class="save-txt">Saved ${(cMax - wMax).toFixed(2)} Tk</span>`}</td>
                </tr>`;
            });
            box.style.display = 'block';
            box.innerHTML = html + '</table>';
        }
    </script>
</body>
</html>
